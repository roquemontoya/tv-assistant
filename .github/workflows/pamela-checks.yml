name: Pamela security and build checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pamela-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Audit pinned dependencies against OSV
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dependency auditor
        run: python -m unittest discover -s tests -p 'test_dependency_audit.py' -v
      - name: Audit runtime and host/test dependencies
        run: python scripts/audit_dependencies.py

  android-build-and-host-tests:
    name: Compile, inspect, and package development APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android build packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build development APK
        run: bash build.sh
      - name: Inspect APK contents, signature, manifest, and hash
        run: |
          set -euo pipefail
          APK="dist/tv-assistant.apk"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          mkdir -p dist
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > dist/APK-SIGNATURE.txt
          "$TOOLS/aapt2" dump badging "$APK" > dist/APK-MANIFEST-BADGING.txt
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          apk = Path("dist/tv-assistant.apk")
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              bad = [n for n in names if n.startswith(("org/java_websocket/", "org/slf4j/"))]
              if bad:
                  raise SystemExit("Forbidden WebSocket/SLF4J entries: " + ", ".join(bad[:10]))
              if "classes.dex" not in names:
                  raise SystemExit("APK is missing classes.dex")
              if "assets/THIRD_PARTY_NOTICES.md" not in names:
                  raise SystemExit("APK is missing third-party notices")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          report = [
              "APK inspection: PASS",
              f"File: {apk}",
              f"Size: {apk.stat().st_size} bytes",
              f"SHA-256: {digest}",
              "DEX: classes.dex present",
              "Third-party notices: present",
              "Java-WebSocket classes: absent",
              "SLF4J classes: absent",
          ]
          Path("dist/APK-INSPECTION.txt").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PY
      - name: Run host-side regression tests
        run: bash test-local.sh
      - name: Publish development APK and inspection reports
        uses: actions/upload-artifact@v4
        with:
          name: pamela-development-apk
          path: |
            dist/tv-assistant.apk
            dist/APK-INSPECTION.txt
            dist/APK-SIGNATURE.txt
            dist/APK-MANIFEST-BADGING.txt
          if-no-files-found: error
          retention-days: 30
