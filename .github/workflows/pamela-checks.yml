name: Pamela security and build checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pamela-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Audit pinned dependencies against OSV
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dependency auditor
        run: python -m unittest discover -s tests -p 'test_dependency_audit.py' -v
      - name: Audit runtime and host/test dependencies
        run: python scripts/audit_dependencies.py

  android-build-and-host-tests:
    name: Compile APK and run host regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android build packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build development APK
        run: bash build.sh
      - name: Run host-side regression tests
        run: bash test-local.sh
