name: Pamela signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create/publish (for example v0.3.0)"
        required: true
        type: string
      source_ref:
        description: "Branch or commit to build (default: current workflow branch)"
        required: false
        default: "feature/pamela-samsung-flowbox"
        type: string

permissions:
  contents: write

concurrency:
  group: pamela-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build, verify, and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android build packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.PAMELA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing PAMELA_KEYSTORE_BASE64 secret" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/pamela-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pamela-signing/pamela-release.jks"
          chmod 600 "$RUNNER_TEMP/pamela-signing/pamela-release.jks"
      - name: Build release APK with permanent signature
        env:
          PAMELA_SIGNING_MODE: release
          PAMELA_KEYSTORE_PATH: ${{ runner.temp }}/pamela-signing/pamela-release.jks
          PAMELA_KEY_ALIAS: ${{ secrets.PAMELA_KEY_ALIAS }}
          PAMELA_STORE_PASSWORD: ${{ secrets.PAMELA_STORE_PASSWORD }}
          PAMELA_KEY_PASSWORD: ${{ secrets.PAMELA_KEY_PASSWORD }}
        run: bash build.sh
      - name: Verify APK signature and calculate checksum
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs dist/tv-assistant.apk | tee dist/APK-SIGNATURE.txt
          sha256sum dist/tv-assistant.apk | tee dist/SHA256SUMS.txt
          "$TOOLS/aapt2" dump badging dist/tv-assistant.apk | tee dist/APK-MANIFEST-BADGING.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          gh release create "$TAG" dist/tv-assistant.apk dist/SHA256SUMS.txt dist/APK-SIGNATURE.txt dist/APK-MANIFEST-BADGING.txt \
            --title "Pamela $TAG" \
            --generate-notes
